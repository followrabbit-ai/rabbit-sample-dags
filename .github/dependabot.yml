# apache-airflow is deliberately ignored here.
#
# requirements.txt is local-development / IDE / CI-parse only. Cloud Composer
# owns the deployed Airflow version, so bumping this file does not change what
# runs anywhere. Two consequences:
#
#   * `apache-airflow==2.10.*` is a range, not a pin, and Dependabot's security
#     updater cannot work with it -- every security-update run failed with
#     `dependency_file_not_supported` instead of no-op'ing (14 failed runs
#     between 2026-07-10 and 2026-09-04, nothing alerting on them).
#   * Every open apache-airflow advisory is patched on the 3.x line, which a
#     2.10-line local-dev pin cannot follow. Pinning an exact 2.10.x would just
#     trade the failed runs for unmergeable 3.x PRs.
#
# The runtime is tracked out of band: the Composer environment
# (rbt-sandbox-stewart / airflow-demo, us-central1) ran
# composer-3-airflow-2.11.1-build.6 and was deleted on 2026-08-11, so no Airflow
# is deployed for these advisories to apply to. If a Composer environment is
# recreated, ITS Airflow version -- not this file -- is what must be checked
# against apache-airflow advisories.
#
# See followrabbit-ai/rabbit-app#8783.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    # ponytail: 0 disables scheduled version-update PRs; this entry exists only
    # so the `ignore` below applies to Dependabot *security* updates. Raise it
    # if this repo ever wants routine dependency PRs.
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: apache-airflow
